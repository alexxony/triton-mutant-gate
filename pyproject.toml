[project]
name = "triton-mutant-gate"
version = "0.1.0"
description = "Plant bugs in Triton kernels, check whether your tests catch them, and let Nemotron close the gaps (execution-verified)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "contree-sdk==0.3.6",
    "httpx>=0.27",
]

[project.scripts]
mutant-gate = "mutant_gate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mutant_gate = ["payload/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
